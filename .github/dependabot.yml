version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 3
    groups: { npm: { patterns: ['*'] } }
    # 24/11/2026 PR #48 (TS 7 + vitest 5) làm job web đỏ, phải revert #50 (AKB ISS-20261124-1737-ec91). Bỏ chặn khi
    # @astrojs/check hỗ trợ TypeScript 7 và @cloudflare/vitest-pool-workers hỗ trợ vitest 5.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: vitest
        versions: ['>=5']
      - dependency-name: '@vitest/*'
        versions: ['>=5']
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { cargo: { patterns: ['*'] } }
  - package-ecosystem: pub
    directory: /apps/app
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { pub: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ['*'] } }
