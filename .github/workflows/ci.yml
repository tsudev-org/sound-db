# Cổng kiểm cho mọi PR và main: quy ước, lõi DSP (Rust + vector đối chiếu Dart), app Flutter, website, máy chủ,
# quét bí mật. Mọi action ghim SHA; công cụ tải ngoài ghim phiên bản + checksum.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_COMMIT: 'c197ca5199e9ee5661e865596c9c07294dfab51c'
  WASM_BINDGEN_VERSION: '0.2.130'

jobs:
  standards:
    name: Quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/check-standards.sh
      - run: ./scripts/sync-standards.sh --check
      - name: Tài sản nhận diện bắt buộc (BRAND_ASSETS.md mục 12)
        run: |
          set -e
          for f in favicon.ico favicon-96x96.png apple-touch-icon.png og-image.png; do
            test -f "apps/web/public/$f" || { echo "Thiếu tài sản bắt buộc: $f"; exit 1; }
          done

  rust:
    name: Lõi DSP (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy -p sounddb-dsp --all-targets -- -D warnings
      - run: cargo clippy -p sounddb-dsp --features wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p sounddb-dsp
      - name: Vector đối chiếu khớp mã nguồn
        run: |
          cargo run -q --release -p sounddb-dsp --example gen_vectors > /tmp/vectors.json
          diff -q conformance/vectors.json /tmp/vectors.json || { echo "conformance/vectors.json cũ - sinh lại"; exit 1; }

  flutter:
    name: Lõi Dart + app Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Thư viện dựng Linux
        run: sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsqlite3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev
      - name: Lõi Dart khớp vector đối chiếu
        working-directory: packages/dsp-dart
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: App - phân tích + test
        working-directory: apps/app
        run: flutter pub get && flutter analyze && flutter test
      - name: App - dựng Linux
        working-directory: apps/app
        run: flutter build linux --release

  apple:
    name: Dựng kiểm iOS + macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: apps/app
        run: flutter pub get && flutter build ios --debug --no-codesign && flutter build macos --debug

  web:
    name: Website + máy chủ
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run tokens:check
      - run: node apps/web/scripts/brand-assets.mjs --check
      - name: WebAssembly
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          ./scripts/build-wasm.sh
      - run: npm --workspace apps/web run build
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace services/sync-api run typecheck
      - run: npm --workspace services/sync-api test
      - run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks-action đòi license khi repo thuộc Organization ⇒ binary ghim phiên bản + checksum.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
