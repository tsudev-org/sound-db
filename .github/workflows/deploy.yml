# Triển khai sounddb.tsudev.com (Worker + D1 + tệp tĩnh) sau khi CI xanh trên main.
# Cần secret ở Environment "production" (bật Required reviewers): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', 'services/sync-api/**', 'packages/dsp-core/**', 'tokens/**', 'package-lock.json']
permissions: { contents: read }
concurrency: { group: deploy-production, cancel-in-progress: false }
env:
  WASM_BINDGEN_VERSION: '0.2.130'
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: { name: production, url: 'https://sounddb.tsudev.com' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
      - run: rustup show && cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: npm run build
      - run: npm --workspace services/sync-api test
      - name: Áp migration + triển khai
        working-directory: services/sync-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sound-db --remote && npx wrangler deploy
      - name: Nghiệm thu production
        run: |
          set -euo pipefail
          sleep 10
          curl -fsS https://sounddb.tsudev.com/api/v1/health | grep -q '"ok":true'
          test "$(curl -sI https://sounddb.tsudev.com/do/ | grep -ci '^content-security-policy:.*wasm-unsafe-eval')" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' https://sounddb.tsudev.com/api/v1/me)" = 401
