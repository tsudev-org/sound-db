# Phát hành app khi đẩy tag `v<YY>.<M>.<DDNN>` (VERSIONING.md mục 2). Dựng Android, Windows, macOS, Linux; iOS chỉ
# dựng kiểm (không ký) cho tới khi có tài khoản Apple Developer. Kèm SHA256SUMS + chứng thực nguồn gốc bản build.
# Secret (Environment "release", bật Required reviewers): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Release
on:
  push: { tags: ['v*'] }
permissions: { contents: read }
env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_COMMIT: 'c197ca5199e9ee5661e865596c9c07294dfab51c'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs: { v: '${{ steps.v.outputs.v }}' }
    steps:
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]{4}$ ]] || { echo "Tag sai khuôn YY.M.DDNN: $v"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: android }
          - { os: ubuntu-24.04, target: linux }
          - { os: windows-2025, target: windows }
          - { os: macos-15, target: macos }
          - { os: macos-15, target: ios }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    env:
      V: ${{ needs.version.outputs.v }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - if: matrix.target == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsqlite3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev
      - name: Khóa ký Android
        if: matrix.target == 'android'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Chưa có khóa: bỏ qua Android (KHÔNG ký bằng khóa debug), các nền tảng khác vẫn phát hành.
          if [ -z "$KS" ]; then echo "::warning::Chưa có secret khóa ký Android - bỏ qua APK"; echo "SKIP_ANDROID=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > apps/app/android/key.properties
      - name: Dựng
        working-directory: apps/app
        env: { SOUNDDB_REQUIRE_RELEASE_KEY: '1' }
        run: |
          flutter pub get
          args=(--release "--build-name=$V" "--dart-define=SOUNDDB_VERSION=$V")
          mkdir -p "$GITHUB_WORKSPACE/out"
          case "${{ matrix.target }}" in
            android)
              [ "${SKIP_ANDROID:-}" = 1 ] && exit 0
              flutter build apk "${args[@]}" --split-per-abi
              cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/out/sound-db_${V}_arm64-setup.apk"
              cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$GITHUB_WORKSPACE/out/sound-db_${V}_x64-setup.apk" ;;
            linux)
              flutter build linux "${args[@]}"
              tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/out/sound-db_${V}_x64-linux.tar.gz" . ;;
            windows)
              flutter build windows "${args[@]}"
              (cd build/windows/x64/runner/Release && 7z a "$GITHUB_WORKSPACE/out/sound-db_${V}_x64-windows.zip" . >/dev/null) ;;
            macos)
              flutter build macos "${args[@]}"
              ditto -c -k --keepParent "build/macos/Build/Products/Release/Sound Db.app" "$GITHUB_WORKSPACE/out/sound-db_${V}_universal-macos.zip" ;;
            ios)
              flutter build ios "${args[@]}" --no-codesign ;;
          esac
      - name: Xóa khóa ký khỏi máy chạy
        if: always() && matrix.target == 'android'
        run: rm -f apps/app/android/key.properties "$RUNNER_TEMP/upload.jks"
      - if: matrix.target != 'ios' && env.SKIP_ANDROID != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'build-${{ matrix.target }}', path: out/*, if-no-files-found: error }

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: 'out/*' }
      - name: Tạo bản phát hành
        env: { GH_TOKEN: '${{ github.token }}', V: '${{ needs.version.outputs.v }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Sound Db $V" \
            --notes "Bản dựng tự động từ ${GITHUB_SHA}. Kiểm chứng: \`sha256sum -c SHA256SUMS --ignore-missing\` và \`gh attestation verify <tệp> --repo $GITHUB_REPOSITORY\`."
