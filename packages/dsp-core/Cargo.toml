[package]
name = "sounddb-dsp"
version = "0.1.0"
description = "Lõi xử lý tín hiệu âm thanh của Sound Db: mức âm (IEC 61672-1), phổ, dải octave (IEC 61260-1), cao độ"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
realfft = "3"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"
